name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Release build
        if: runner.os == 'Linux'
        run: cargo build --release --locked
      - name: Control Room frontend tests (Node.js)
        run: node --test
      - name: Control Room browser smoke test (Chromium)
        if: runner.os == 'Linux'
        run: python3 quality/browser_smoke.py
      - name: Independent acceptance and optional adapter tests
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s quality -p 'test_*.py'
          python3 -m unittest discover -s adapters/opencode -p 'test_*.py'

      - name: Real Docker worker lifecycle (isolated hosted runner)
        if: runner.os == 'Linux'
        timeout-minutes: 35
        env:
          APOLLO_OFFICE_CONTAINER: apollo-ci-${{ github.run_id }}-${{ github.run_attempt }}
          APOLLO_OFFICE_REAL_DOCKER: "1"
        run: |
          set -euo pipefail
          name="$APOLLO_OFFICE_CONTAINER"
          [[ "$name" =~ ^apollo-ci-[0-9]+-[0-9]+$ ]]
          cleanup() {
            docker unpause "$name" >/dev/null 2>&1 || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$name-work" "$name-cargo" "$name-npm-downloads" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cargo test --locked real_docker_worker_lifecycle -- --ignored --nocapture
