name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Release build
        if: runner.os == 'Linux'
        run: cargo build --release --locked
      - name: Watcher process restart acceptance (isolated network)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --clear-groups -- env -i PATH=/usr/bin:/bin python3 "$3" "$4"
          ' _ "$(id -u)" "$(id -g)" "$PWD/quality/watcher_process_acceptance.py" "$PWD/target/release/apollo-office"
      - name: Watcher inbox restart acceptance (isolated network)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --clear-groups -- env -i PATH=/usr/bin:/bin python3 "$3" "$4"
          ' _ "$(id -u)" "$(id -g)" "$PWD/quality/watcher_inbox_acceptance.py" "$PWD/target/release/apollo-office"
      - name: Steward process restart acceptance (isolated network)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --clear-groups -- env -i PATH=/usr/bin:/bin python3 "$3" "$4"
          ' _ "$(id -u)" "$(id -g)" "$PWD/quality/steward_process_acceptance.py" "$PWD/target/release/apollo-office"
      - name: Control Room frontend tests (Node.js)
        run: node --test
      - name: Control Room browser smoke test (Chromium)
        if: runner.os == 'Linux'
        run: python3 quality/browser_smoke.py
      - name: Independent acceptance and optional adapter tests
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s quality -p 'test_*.py'
          python3 -m unittest discover -s adapters/opencode -p 'test_*.py'

      - name: Real Docker worker lifecycle (isolated hosted runner)
        if: runner.os == 'Linux'
        timeout-minutes: 35
        env:
          APOLLO_OFFICE_CONTAINER: apollo-ci-${{ github.run_id }}-${{ github.run_attempt }}
          APOLLO_OFFICE_REAL_DOCKER: "1"
        run: |
          set -euo pipefail
          name="$APOLLO_OFFICE_CONTAINER"
          [[ "$name" =~ ^apollo-ci-[0-9]+-[0-9]+$ ]]
          cleanup() {
            docker unpause "$name" >/dev/null 2>&1 || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$name-work" "$name-cargo" "$name-npm-downloads" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cargo test --locked real_docker_worker_lifecycle -- --ignored --nocapture
          python3 quality/worker_node_acceptance.py

      - name: Real SSH worker transport (isolated loopback)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          fixture=$(mktemp -d "$RUNNER_TEMP/apollo-ssh.XXXXXX")
          mkdir -p "$fixture/.ssh" "$HOME/.ssh"
          chmod 700 "$fixture" "$fixture/.ssh" "$HOME/.ssh"
          config="$HOME/.ssh/config"
          if [ -f "$config" ]; then cp -p "$config" "$fixture/original-config"; fi
          cleanup() {
            ssh -o "ControlPath=$fixture/.ssh/cm-ao-%r@%h:%p" -O exit apollo-ci-ssh >/dev/null 2>&1 || true
            if [ -f "$fixture/sshd.pid" ]; then sudo kill "$(cat "$fixture/sshd.pid")" || true; fi
            if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
            if [ -f "$fixture/original-config" ]; then
              cp -p "$fixture/original-config" "$config"
            else
              rm -f "$config"
            fi
            rm -rf -- "$fixture"
          }
          trap cleanup EXIT
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/host"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/client"
          cp "$fixture/client.pub" "$fixture/authorized_keys"
          chmod 600 "$fixture/authorized_keys"
          printf '[127.0.0.1]:22222 %s\n' "$(cat "$fixture/host.pub")" > "$fixture/known_hosts"
          cat > "$fixture/sshd_config" <<EOF
          Port 22222
          ListenAddress 127.0.0.1
          HostKey $fixture/host
          PidFile $fixture/sshd.pid
          AuthorizedKeysFile $fixture/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AuthenticationMethods publickey
          PermitRootLogin no
          AllowUsers $(id -un)
          UsePAM yes
          AllowAgentForwarding yes
          AcceptEnv APOLLO_FIXTURE_API_KEY
          EOF
          cat > "$config" <<EOF
          Host apollo-ci-ssh
            HostName 127.0.0.1
            Port 22222
            User $(id -un)
            IdentityFile $fixture/client
            IdentitiesOnly yes
            UserKnownHostsFile $fixture/known_hosts
            StrictHostKeyChecking yes
            ForwardAgent yes
            SendEnv APOLLO_FIXTURE_API_KEY
          EOF
          chmod 600 "$config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$fixture/sshd_config" -E "$fixture/sshd.log"
          eval "$(ssh-agent -s)"
          ssh-add "$fixture/client"
          export APOLLO_FIXTURE_API_KEY=synthetic-ci-fixture
          # Positive control: verify the test server can receive the synthetic
          # variable and agent socket before testing Apollo's restrictions.
          ssh -o BatchMode=yes apollo-ci-ssh 'test -n "$SSH_AUTH_SOCK" && test "$APOLLO_FIXTURE_API_KEY" = synthetic-ci-fixture'
          export APOLLO_OFFICE_REAL_SSH=1
          export APOLLO_OFFICE_SSH_CONTROL_DIR="$fixture"
          cargo test --locked real_ssh_worker_transport -- --ignored --nocapture
