name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: apollo-office-windows-x64.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: apollo-office-windows-arm64.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: apollo-office-linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, name: apollo-office-linux-arm64, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: apollo-office-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: apollo-office-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          f=target/${{ matrix.target }}/release/apollo-office
          [ -f "$f.exe" ] && f="$f.exe"
          cp "$f" "${{ matrix.name }}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-bin-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-bin-${{ github.run_attempt }}-*
          path: dist
          merge-multiple: true
      - name: Validate inventory and generate manifest
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          python3 ../scripts/release_manifest.py > latest.json
      - name: Sign validated manifest
        working-directory: dist
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_KEY"
          key=$(mktemp "$RUNNER_TEMP/apollo-release-key.XXXXXX")
          trap 'rm -f -- "$key" "$key.pub"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          unset RELEASE_KEY
          openssl pkeyutl -sign -inkey "$key" -rawin -in latest.json -out latest.json.sig.raw
          openssl pkey -in "$key" -pubout -out "$key.pub"
          openssl pkeyutl -verify -pubin -inkey "$key.pub" -rawin -in latest.json -sigfile latest.json.sig.raw
          base64 -w0 latest.json.sig.raw > latest.json.sig
          test -s latest.json.sig
          rm -f -- "$key" "$key.pub" latest.json.sig.raw
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-signed-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed-${{ github.run_attempt }}
          path: dist
      - name: Revalidate staged release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py --verify dist
      - name: Publish only a new, complete release
        env:
          GH_TOKEN: ${{ github.token }}
          APOLLO_OFFICE_UPDATE_PUBKEY: ${{ vars.APOLLO_OFFICE_UPDATE_PUBKEY }}
        shell: bash
        run: |
          bash scripts/publish_release.sh dist
